name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Record version
        id: version
        run: echo "version=$(ls dist/*.whl | sed -E 's/.*dtfls-([^-]+)-.*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag v$tag does not match pyproject.toml version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false

  # Requires PyPI Trusted Publishing to be registered for this repo first:
  # pypi.org -> Account Settings -> Publishing -> Add a pending publisher
  #   PyPI project name: dtfls
  #   Owner: wrnkt   Repository: dtfls   Workflow: release.yml   Environment: pypi
  # See RELEASING.md for the full one-time setup.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dtfls/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Requires the wrnkt/homebrew-dtfls tap repo to exist, with an initial
  # Formula/dtfls.rb committed (see packaging/homebrew/dtfls.rb), and a
  # HOMEBREW_TAP_TOKEN repo secret (a PAT with contents:write on the tap
  # repo, since the default GITHUB_TOKEN can't push to a different repo).
  # See RELEASING.md for the full one-time setup.
  homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: dtfls
          formula-path: Formula/dtfls.rb
          homebrew-tap: wrnkt/homebrew-dtfls
          download-url: https://github.com/wrnkt/dtfls/archive/refs/tags/${{ github.ref_name }}.tar.gz
          commit-message: |
            {{formulaName}} {{version}}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
