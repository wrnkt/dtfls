name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Record version
        id: version
        run: echo "version=$(ls dist/*.whl | sed -E 's/.*dtfls-([^-]+)-.*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag v$tag does not match pyproject.toml version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false

  # Disabled until PyPI Trusted Publishing is configured for this repo:
  # pypi.org -> Account Settings -> Publishing -> Add a pending publisher
  #   PyPI project name: dtfls
  #   Owner: wrnkt   Repository: dtfls   Workflow: release.yml   Environment: pypi
  # Once that's done, flip `if: false` to `if: true` below.
  pypi:
    needs: build
    if: false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dtfls/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
