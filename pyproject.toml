[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtfls"
version = "0.1.0"
description = "Portable dotfile sync from a git repo."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "wrnkt" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/wrnkt/dtfls"

[project.scripts]
dtfls = "dtfls.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/dtfls"]
